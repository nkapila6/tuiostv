<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tuios-pip" content="viewer">
<title>tuios pip</title>
<style>
  :root {
    --bg: #000;
    --fg: #e8e8e8;
    --muted: #9a9a9a;
    --bar: rgba(255, 255, 255, 0.22);
    --fill: #e8e8e8;
    --shade: rgba(0, 0, 0, 0.78);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; cursor: default; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* terminal-browser can't capture hardware-decoded video layers (big videos
     come out black), so frames are painted onto the canvas instead */
  video { opacity: 0; pointer-events: none; }

  #msg {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 6px;
    text-align: center; padding: 16px; color: var(--muted);
  }
  #msg strong { color: var(--fg); font-weight: 600; }
  body.live #msg { display: none; }

  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 10px;
    background: linear-gradient(to top, var(--shade), var(--shade) 55%, transparent);
    opacity: 0; transition: opacity 240ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  body.live.show #hud, body.live.paused #hud { opacity: 1; }
  #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
  #row { display: flex; align-items: center; gap: 10px; }
  #state { width: 1.5ch; text-align: center; }
  #track { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
  #track div { height: 3px; width: 100%; background: var(--bar); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--fill); }
  #time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #keys { color: var(--muted); margin-top: 4px; font-size: 11px; }
  #count { color: var(--muted); }

  #picker {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, 0.6);
  }
  #picker[hidden] { display: none; }
  #panel {
    width: min(560px, 100%); max-height: 100%; overflow: auto;
    background: #141414; border: 1px solid #2c2c2c; border-radius: 10px; padding: 6px;
  }
  #panel h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 6px 8px 8px; }
  .src { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .src.sel { background: #2a2a2a; }
  .src .mark { width: 1.5ch; flex: none; color: var(--fill); }
  .src .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src .meta { flex: none; color: var(--muted); font-size: 11px; }
  #panel .empty, #panel .help { color: var(--muted); padding: 7px 8px; font-size: 11px; }
  @media (max-width: 420px) { #keys { display: none; } .src .meta { display: none; } }
  @media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<div id="picker" hidden><div id="panel"><h2>Videos in your browser</h2><div id="plist"></div><div class="help">&uarr;&darr; choose &middot; enter show &middot; esc close</div></div></div>
<div id="msg"><strong>Nothing playing</strong><span id="hint">Play a video in Firefox or Chrome with the tuios-pip extension on.</span></div>
<div id="hud">
  <div id="title"></div>
  <div id="row">
    <span id="state">&#9654;</span>
    <div id="track"><div><div id="fill"></div></div></div>
    <span id="time">0:00 / 0:00</span>
  </div>
  <div id="keys">space play/pause &middot; &larr;&rarr; 5s &middot; j/l 10s &middot; n/p next/prev &middot; s videos <span id="count"></span></div>
</div>
<script>
const id = crypto.randomUUID();
const $ = (s) => document.querySelector(s);
const video = $("#v");
let dur = 0;

// MSE player for the WebM slices the tab records. One MediaSource per
// recording ("gen"): each begins with its own init segment.
let gen = 0;
let ms = null;
let sb = null;
let pending = [];

// in order; the helper relays them in the order it gets them
let outbox = Promise.resolve();
function send(msg) {
  outbox = outbox.then(async () => {
    try {
      const r = await fetch(`/msg?from=viewer&id=${id}`, {
        method: "POST",
        headers: { "X-Pip": "1", "Content-Type": "application/json" },
        body: JSON.stringify(msg),
      });
      if (r.status === 410) replaced();
    } catch {}
  });
}

// a newer viewer took over; rejoining would just kick it back out
function replaced() {
  stopped = true;
  idle("This viewer was replaced by a newer one. Reload to take it back.");
}

function teardown() {
  gen = 0;
  sb = null;
  ms = null;
  pending = [];
  if (video.src) {
    URL.revokeObjectURL(video.src);
    video.removeAttribute("src");
    video.load();
  }
  document.body.classList.remove("live");
}

function idle(text) {
  teardown();
  $("#hint").textContent = text || "Play a video in Firefox or Chrome with the tuios-pip extension on.";
}

function begin(m) {
  teardown();
  if (!window.MediaSource || !MediaSource.isTypeSupported(m.mime)) {
    idle(`This viewer can't play ${m.mime}.`);
    return;
  }
  gen = m.gen;
  const src = new MediaSource();
  ms = src;
  video.src = URL.createObjectURL(src);
  src.addEventListener("sourceopen", () => {
    if (ms !== src) return;
    sb = src.addSourceBuffer(m.mime);
    // recorder timestamps restart per gen; sequence mode just plays them in order
    sb.mode = "sequence";
    sb.addEventListener("updateend", () => { chase(); pump(); });
    pump();
  }, { once: true });
}

function chunk(m) {
  if (m.gen !== gen) return;
  const bin = atob(m.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  pending.push(bytes);
  pump();
}

function pump() {
  if (!sb || sb.updating || !pending.length) return;
  try {
    sb.appendBuffer(pending.shift());
  } catch {
    // decoder choked; the next gen starts clean
    pending = [];
  }
}

// stay at the live edge and keep the buffer short
function chase() {
  const b = video.buffered;
  if (!b.length || !sb || sb.updating) return;
  const end = b.end(b.length - 1);
  if (end - video.currentTime > 0.5) video.currentTime = end - 0.1;
  if (video.paused) video.play().catch(() => {});
  if (video.currentTime - b.start(0) > 30) sb.remove(b.start(0), video.currentTime - 10);
}

video.addEventListener("loadeddata", () => document.body.classList.add("live"));

const canvas = $("#c");
const g = canvas.getContext("2d");
function fit() {
  const d = devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * d);
  canvas.height = Math.round(innerHeight * d);
  lastPainted = -1;
}
let lastPainted = -1;
function paint() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !document.body.classList.contains("live")) {
    if (lastPainted !== -2) g.clearRect(0, 0, canvas.width, canvas.height);
    lastPainted = -2;
  } else if (video.currentTime !== lastPainted) {
    lastPainted = video.currentTime;
    const k = Math.min(canvas.width / vw, canvas.height / vh);
    const w = vw * k, h = vh * k;
    g.fillStyle = "#000";
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
  }
  requestAnimationFrame(paint);
}
addEventListener("resize", fit);
fit();
requestAnimationFrame(paint);

function fmt(s) {
  if (!isFinite(s)) return "live";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

function onState(s) {
  dur = s.dur;
  $("#title").textContent = s.title || "";
  $("#state").innerHTML = s.paused ? "&#10074;&#10074;" : "&#9654;";
  document.body.classList.toggle("paused", s.paused);
  $("#fill").style.width = isFinite(s.dur) && s.dur > 0 ? `${(s.t / s.dur) * 100}%` : "100%";
  $("#time").textContent = isFinite(s.dur) ? `${fmt(s.t)} / ${fmt(s.dur)}` : "live";
}

// picker: every tab with a video the helper knows about
let sources = [];
let activeId = "";
let sel = 0;
const picker = $("#picker");

function onSources(m) {
  sources = m.list;
  activeId = m.active;
  $("#count").textContent = sources.length > 1 ? `(${sources.length})` : "";
  sel = Math.min(sel, Math.max(0, sources.length - 1));
  if (!picker.hidden) renderPicker();
}

function renderPicker() {
  const list = $("#plist");
  list.replaceChildren();
  if (!sources.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No tabs with a video yet.";
    list.append(e);
    return;
  }
  sources.forEach((src, i) => {
    const row = document.createElement("div");
    row.className = "src" + (i === sel ? " sel" : "");
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = src.id === activeId ? "\u25CF" : "";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = src.title || "(untitled)";
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = [src.host, src.paused ? "paused" : "playing"].filter(Boolean).join(" \u00B7 ");
    row.append(mark, name, meta);
    row.addEventListener("click", () => pick(i));
    list.append(row);
  });
  list.children[sel]?.scrollIntoView({ block: "nearest" });
}

function openPicker() {
  sel = Math.max(0, sources.findIndex((s) => s.id === activeId));
  picker.hidden = false;
  renderPicker();
}

function closePicker() {
  picker.hidden = true;
}

function pick(i) {
  const src = sources[i];
  closePicker();
  if (src && src.id !== activeId) send({ type: "pick", source: src.id });
}

picker.addEventListener("click", (e) => { if (e.target === picker) closePicker(); });

async function handle(m) {
  switch (m.type) {
    case "sources": onSources(m); break;
    case "begin": begin(m); break;
    case "chunk": chunk(m); break;
    case "state": onState(m); break;
    case "reset": teardown(); break;
    case "idle": idle(); break;
  }
}

let polling = false;
let stopped = false;
async function poll() {
  if (polling) return;
  polling = true;
  while (!stopped) {
    try {
      const r = await fetch(`/poll?role=viewer&id=${id}`, { headers: { "X-Pip": "1" } });
      if (r.status === 410) return replaced();
      for (const m of await r.json()) await handle(m);
    } catch {
      idle("Lost the tuios-pip helper. Retrying...");
      await new Promise((ok) => setTimeout(ok, 2000));
    }
  }
}

async function join() {
  try {
    await fetch(`/msg?from=viewer&id=${id}`, {
      method: "POST",
      headers: { "X-Pip": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ type: "join" }),
    });
  } catch {}
  poll();
}

// controls go back to the real tab; this page never plays anything itself
const cmd = (action, extra) => send({ type: "cmd", action, ...extra });
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (!picker.hidden) {
    if (k === "ArrowDown" || k === "j") sel = Math.min(sel + 1, sources.length - 1);
    else if (k === "ArrowUp" || k === "k") sel = Math.max(sel - 1, 0);
    else if (k === "Enter") return e.preventDefault(), pick(sel);
    else if (k === "Escape" || k === "s") return e.preventDefault(), closePicker();
    else return;
    e.preventDefault();
    renderPicker();
    return;
  }
  if (k === "s") openPicker();
  else if (k === " " || k === "k") cmd("toggle");
  else if (k === "ArrowLeft") cmd("seek", { by: -5 });
  else if (k === "ArrowRight") cmd("seek", { by: 5 });
  else if (k === "j") cmd("seek", { by: -10 });
  else if (k === "l") cmd("seek", { by: 10 });
  else if (k === "n") send({ type: "next" });
  else if (k === "p") send({ type: "prev" });
  else return;
  e.preventDefault();
  nudge();
});
$("#track").addEventListener("click", (e) => {
  if (!isFinite(dur) || dur <= 0) return;
  const box = e.currentTarget.getBoundingClientRect();
  cmd("seekTo", { t: ((e.clientX - box.left) / box.width) * dur });
});
canvas.addEventListener("click", () => cmd("toggle"));

let hideTimer;
function nudge() {
  document.body.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => document.body.classList.remove("show"), 2500);
}
addEventListener("mousemove", nudge);

addEventListener("pagehide", () => {
  if (!stopped) fetch(`/msg?from=viewer&id=${id}`, {
    method: "POST", keepalive: true,
    headers: { "X-Pip": "1", "Content-Type": "application/json" },
    body: JSON.stringify({ type: "bye" }),
  });
});

join();
</script>
</body>
</html>
